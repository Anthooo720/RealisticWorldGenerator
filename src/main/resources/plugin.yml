name: RealisticWorldGenerator
version: '1.9.0'
main: fr.antho.realisticworld.RealisticWorldPlugin
description: "Générateur naturel réaliste : hydrologie continue, rivières/lacs organiques, grottes vanilla+, biomes 26.2 et structures vanilla alignées."
author: Antho
api-version: '26.2'
load: STARTUP
commands:
  rwg:
    description: "Diagnostic du monde naturel RealisticWorldGenerator"
    usage: "/rwg inspect"
    permission: realisticworld.command
permissions:
  realisticworld.command:
    default: true
