name: RealisticWorldGenerator
version: '1.8.0'
main: fr.antho.realisticworld.RealisticWorldPlugin
description: "Générateur naturel réaliste : hydrologie côtière sécurisée, rivières v6, structures vanilla alignées et biomes ouverts plus vivants."
author: Antho
api-version: '26.2'
load: STARTUP
commands:
  rwg:
    description: "Diagnostic du monde naturel RealisticWorldGenerator"
    usage: "/rwg inspect"
    permission: realisticworld.command
permissions:
  realisticworld.command:
    default: true
