config-version: 11

generation:
  # 0 = seed du monde Minecraft.
  seed: 0

terrain:
  sea-level: 63
  base-scale: 0.00118
  continent-scale: 0.00032
  warp-scale: 0.00042
  warp-strength: 150.0
  hill-height: 28.0
  foothill-height: 34.0
  mountain-height: 112.0
  mountain-chain-width: 0.31
  alpine-ruggedness: 0.88
  valley-depth: 18.0
  octaves: 5
  tectonic-cell-size: 5600
  tectonic-boundary-width: 1450.0
  glacial-valley-strength: 0.78
  micro-relief: 4.2

geology:
  enabled: true
  province-size: 5200
  contact-blend: 0.18
  # Couches rocheuses 3D visibles dans les falaises et grottes.
  strata-scale: 0.010
  strata-thickness: 7.0
  dip-strength: 0.34

landscape:
  enabled: true
  region-scale: 0.00020
  cliff-strength: 0.72
  canyon-strength: 0.62
  wetland-strength: 0.55
  # Grandes formes rares qui cassent la monotonie régionale sans ajouter du bruit partout.
  plateau-strength: 0.68
  landmark-strength: 0.74

ocean:
  # Plateau continental -> talus -> océan profond.
  shelf-width: 0.24
  shelf-depth: 18.0
  abyss-depth: 58.0
  coast-ruggedness: 0.24
  island-frequency: 0.16
  estuary-strength: 0.42

erosion:
  enabled: true
  tile-size: 320
  sample-spacing: 8
  margin-samples: 10
  hydraulic-iterations: 42
  thermal-iterations: 6
  rainfall: 0.40
  evaporation: 0.15
  capacity: 1.58
  erosion-rate: 0.23
  deposition-rate: 0.14
  talus: 2.50
  intensity: 0.94
  velocity-inertia: 0.44

rivers:
  enabled: true
  tile-size: 640
  sample-spacing: 5
  margin-samples: 28
  accumulation-threshold: 46.0
  max-carve-depth: 5.4
  max-width: 15.0
  min-width: 1.5
  bank-buffer: 1.55
  max-water-depth: 2.5
  # Les fortes pentes restent des ravins/torrents, pas des nappes d'eau en escalier.
  max-wet-grade: 0.17
  waterfall-grade: 0.11
  terrace-run: 14
  meander-scale: 0.0030
  meander-strength: 1.05
  floodplain-width: 9.5
  # Coupe transversale v5 : lit en U + berges progressives + plaine légèrement nivelée.
  profile-exponent: 1.85
  bank-slope-width: 4.2
  bank-max-cut: 2.4
  floodplain-max-cut: 1.8
  edge-roughness: 0.72
  secondary-channel-frequency: 0.14
  # Raccord estuarien : la surface du cours d'eau converge progressivement vers la mer.
  coastal-merge-height: 14.0
  coastal-water-gradient: 0.34
  # Fond plus large et moins en V ; irrégularité lente de la hauteur des berges.
  channel-bed-flatness: 0.52
  bank-height-jitter: 0.42

lakes:
  enabled: true
  # Les lacs sont des bassins continus indépendants des frontières de tuiles.
  cell-size: 1800
  frequency: 0.20
  min-radius: 26.0
  max-radius: 105.0
  max-depth: 9.0
  min-rim-height: 4.5
  # Empêche un lac local de recouper/recouvrir une côte océanique.
  coast-guard-height: 12.0
  rim-samples: 28

biomes:
  # Plus de régions ouvertes sans transformer le monde en plaines vides.
  open-flat-max-slope: 0.145
  open-flat-min-openness: 0.43
  temperate-forest-humidity: 0.70
  dark-forest-humidity: 0.86
  open-region-bias: 0.16

climate:
  latitude-period: 24000.0
  temperature-scale: 0.00062
  humidity-scale: 0.00072
  altitude-lapse-rate: 0.0030
  ocean-moisture: 0.20
  aspect-strength: 0.12
  orographic-strength: 0.22

caves:
  # Grottes v3 vanilla+ : Minecraft génère le réseau principal, RWG ajoute seulement de rares connecteurs/salles moyennes.
  enabled: true
  # Paramètres historiques conservés pour compatibilité de configuration.
  large-scale: 0.018
  detail-scale: 0.047
  threshold: 0.72
  min-y: -52
  max-y: 112
  surface-buffer: 12
  ocean-buffer: 18
  tunnel-scale: 0.024
  tunnel-radius: 0.094
  chamber-spacing: 152
  chamber-frequency: 0.068
  max-chamber-radius: 10.0
  # Surcouche seulement : les carvers vanilla restent le réseau principal.
  overlay-strength: 0.76
  vertical-link-frequency: 0.038
  aquifer-frequency: 0.045
  aquifer-max-y: -18
  # Les carvers vanilla sous un océan custom peuvent ouvrir des poches d'air géantes.
  protect-ocean-carvers: true
  ocean-carver-max-land-ratio: 0.34

vegetation:
  enabled: true
  tree-density: 0.074
  shrub-density: 0.32
  ground-cover-density: 0.62
  boulder-density: 0.018
  grove-scale: 0.00120
  succession-scale: 0.00048
  deadwood-density: 0.042
  # Part des arbres utilisant des formes paramétriques uniques.
  parametric-variation: 0.92
  # Les biomes ouverts restent vivants via herbes/fleurs/buissons légers ;
  # les rares arbres sont laissés aux décorations vanilla après les structures.
  open-ground-cover-density: 0.78
  open-shrub-density: 0.11

natural-features:
  enabled: true
  talus-density: 0.18
  outcrop-density: 0.14
  fallen-log-density: 0.034
  stump-density: 0.020
  bank-gravel-density: 0.24

compatibility:
  # Base vanilla activée : RWG se limite à une surcouche légère.
  vanilla-caves: true
  # Paper place les blocs des structures vanilla pendant sa passe de décoration.
  # Cette option doit rester true pour que /locate structure corresponde à une structure visible.
  vanilla-decorations: true

performance:
  erosion-cache-tiles: 64
  watershed-cache-tiles: 48
  river-cache-tiles: 48
  # Cache commun terrain+rivière+lac utilisé par noise/surface/caves/getBaseHeight.
  column-cache-chunks: 192
