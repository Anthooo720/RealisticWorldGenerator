config-version: 13

generation:
  # 0 = seed du monde Minecraft.
  seed: 0

terrain:
  sea-level: 63
  base-scale: 0.00118
  continent-scale: 0.00032
  warp-scale: 0.00042
  warp-strength: 150.0
  hill-height: 28.0
  foothill-height: 34.0
  mountain-height: 112.0
  mountain-chain-width: 0.31
  alpine-ruggedness: 0.88
  valley-depth: 18.0
  octaves: 5
  tectonic-cell-size: 5600
  tectonic-boundary-width: 1450.0
  glacial-valley-strength: 0.78
  micro-relief: 4.2

geology:
  enabled: true
  province-size: 5200
  contact-blend: 0.18
  strata-scale: 0.010
  strata-thickness: 7.0
  dip-strength: 0.34

landscape:
  enabled: true
  region-scale: 0.00020
  cliff-strength: 0.72
  canyon-strength: 0.62
  wetland-strength: 0.55
  plateau-strength: 0.68
  landmark-strength: 0.74
  regional-contrast: 1.18

ocean:
  shelf-width: 0.24
  shelf-depth: 18.0
  abyss-depth: 58.0
  coast-ruggedness: 0.24
  island-frequency: 0.16
  estuary-strength: 0.42

erosion:
  enabled: true
  tile-size: 320
  # v1.9.1 : grille légèrement plus espacée, l'interpolation conserve les formes macro.
  sample-spacing: 10
  margin-samples: 9
  # Le rendu reste proche, mais les premières générations de tuiles coûtent nettement moins.
  hydraulic-iterations: 28
  thermal-iterations: 4
  rainfall: 0.40
  evaporation: 0.15
  capacity: 1.58
  erosion-rate: 0.23
  deposition-rate: 0.14
  talus: 2.50
  intensity: 0.94
  velocity-inertia: 0.44

rivers:
  enabled: true
  tile-size: 640
  # La Catmull-Rom garde un tracé fluide avec une grille D8 moins coûteuse.
  sample-spacing: 6
  margin-samples: 22
  accumulation-threshold: 46.0
  max-carve-depth: 5.2
  max-width: 17.0
  min-width: 1.7
  bank-buffer: 1.45
  max-water-depth: 2.6
  max-wet-grade: 0.17
  waterfall-grade: 0.11
  terrace-run: 14
  meander-scale: 0.0027
  meander-strength: 1.02
  floodplain-width: 11.0
  # Exposant du profil en U : plus bas que v1.9 pour éviter le fond trop plat.
  profile-exponent: 1.55
  # Largeur physique de la pente rive -> terrain naturel.
  bank-slope-width: 7.0
  bank-max-cut: 2.0
  floodplain-max-cut: 1.4
  # Moins de bruit au bord : silhouette moins dentelée et plus naturelle.
  edge-roughness: 0.40
  secondary-channel-frequency: 0.07
  coastal-merge-height: 14.0
  coastal-water-gradient: 0.34
  channel-bed-flatness: 0.38
  bank-height-jitter: 0.26
  thalweg-offset: 0.14
  # 1.0 = raccord quasi hermite sans épaule marquée.
  bank-transition-power: 1.0

lakes:
  enabled: true
  cell-size: 1800
  frequency: 0.20
  min-radius: 26.0
  max-radius: 105.0
  max-depth: 9.0
  min-rim-height: 4.5
  coast-guard-height: 12.0
  rim-samples: 28
  river-connect-distance: 20.0
  shore-blend-width: 6.0
  bed-roughness: 0.42

biomes:
  # Les biomes utilisés par les villages vanilla exigent maintenant une pente macro plus faible.
  open-flat-max-slope: 0.095
  open-flat-min-openness: 0.50
  temperate-forest-humidity: 0.70
  dark-forest-humidity: 0.86
  open-region-bias: 0.12
  transition-radius: 14
  transition-patch-scale: 0.045
  rare-biome-frequency: 0.18

